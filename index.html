<!DOCTYPE html>
<html lang="es">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <meta name="monetag" content="248a01abecd51b53fa71e626df4e28e6">
    <title>Tinka Suerte 🇵🇪</title>
    <style>
        body { font-family: 'Segoe UI', Tahoma, Geneva, Verdana, sans-serif; background-color: #f4f7f6; padding: 20px; }
        .container { text-align: center; background: white; padding: 30px; border-radius: 15px; box-shadow: 0 4px 15px rgba(0,0,0,0.1); max-width: 500px; margin: auto; }
        h1 { color: #ff5722; font-size: 2rem; margin-top: 0; }
        p { color: #2c3e50; font-size: 1rem; margin-bottom: 25px; }
        .balls-container { display: flex; justify-content: center; gap: 10px; margin-bottom: 25px; height: 60px; align-items: center; }
        .ball { width: 50px; height: 50px; border-radius: 50%; background-color: #ffeb3b; color: #212121; font-weight: bold; font-size: 1.2rem; display: flex; align-items: center; justify-content: center; box-shadow: 0 4px 6px rgba(0,0,0,0.1); border: 2px solid #fbc02d; }
        @keyframes popIn { to { transform: scale(1); } }
        button { background-color: #00b4d8; color: white; border: none; padding: 12px 25px; font-size: 1.1rem; font-weight: bold; border-radius: 25px; cursor: pointer; transition: background 0.2s, transform 0.1s; box-shadow: 0 4px 6px rgba(0,0,0,0.1); }
        button:active { transform: scale(0.98); }
        .footer { margin-top: 25px; font-size: 0.8rem; color: #7f8c8d; }
    </style>
</head>
<body>

    <div class="container">
        <h1>Tinka Suerte 🇵🇪</h1>
        <p>Genera tu jugada ganadora (6 números del 1 al 50)</p>
        
        <div class="balls-container" id="ballsBox">
            <!-- Aquí aparecerán las bolillas -->
        </div>
        
        <button onclick="generateTinkaNumbers()">¡Generar Jugada!</button>
        
        <div class="footer">Simulador de Lotería Independiente</div>
    </div>

    <script>
        function generateTinkaNumbers() {
            const ballsBox = document.getElementById('ballsBox');
            ballsBox.innerHTML = '';
            let numbers = [];
            while(numbers.length < 6) {
                let randomNum = Math.floor(Math.random() * 50) + 1;
                if(!numbers.includes(randomNum)) {
                    numbers.push(randomNum);
                }
            }
            numbers.sort((a, b) => a - b);
            numbers.forEach((num, index) => {
                setTimeout(() => {
                    const ball = document.createElement('div');
                    ball.className = 'ball';
                    ball.style.transform = 'scale(0)';
                    ball.style.animation = 'popIn 0.3s forwards';
                    ball.innerText = num;
                    ballsBox.appendChild(ball);
                }, index * 200);
            });
        }
    </script>
</body>
</html>
